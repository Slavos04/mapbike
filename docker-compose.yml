version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mapbike_backend
    ports:
      - "8000:8000"
    environment:
      - ELEVATION_PROVIDER=open-meteo
    volumes:
      - ./backend/cache:/app/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mapbike_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - default
      - siec_web
    restart: unless-stopped

networks:
  siec_web:
    external: true
